<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time2Padel — Jogadores</title><style>:root{--g:#20cf68;--d:#303030;--bg:#f4f4f4;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#222}header{background:var(--d);color:#fff;padding:14px 16px;font-size:22px;font-weight:800}.topnav{display:flex;gap:7px;flex-wrap:wrap;padding:10px;max-width:1200px;margin:auto}.topnav a{background:#fff;border:1px solid #ddd;border-radius:8px;padding:9px 11px;text-decoration:none;color:#222;font-weight:800;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}.head{background:var(--g);color:#fff;padding:12px;font-size:19px;font-weight:800}.body{padding:14px}.grid{display:grid;grid-template-columns:1fr 150px auto;gap:8px}.grid input,.grid select,.search{height:42px;border:1px solid #aaa;border-radius:8px;padding:8px;font-size:15px}.green{background:var(--g);color:#fff;border:1px solid var(--g);border-radius:8px;font-weight:800;padding:9px 12px}.search{width:100%;margin:10px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}.actions button{margin-right:5px}.win{font-weight:900;color:#159a52}@media(max-width:650px){.grid{grid-template-columns:1fr 110px}.grid button{grid-column:1/-1}.table{font-size:13px}}</style><script src="cloud.js"></script></head><body><header>Time2Padel 🏆 — Base de Jogadores</header><nav class="topnav"><a href="index.html">🏠 Início</a><a href="jogadores.html">👤 Jogadores</a><a href="mega-mix.html">🏆 Mega Mix</a><a href="mix6.html">🎾 Mix 6</a><a href="mix4.html">🎾 Mix 4</a><a href="publico.html">📣 Público</a></nav><main class="wrap"><div class="card"><div class="head">👤 Base de Dados Central</div><div class="body"><p>Esta base é <b>manual</b>. As inscrições não criam jogadores automaticamente.</p><div class="grid"><input id="name" placeholder="Nome completo"><select id="level"><option>M1</option><option>M2</option><option selected>M3</option><option>M4</option><option>M5</option><option>F1</option><option>F2</option><option>F3</option><option>F4</option><option>F5</option><option>Outro</option></select><button class="green" id="add">+ ADICIONAR</button></div><input class="search" id="search" placeholder="Pesquisar jogador..."><div id="msg"></div><div id="list"></div></div></div></main><script>
let rows=[];let editId=null;
async function boot(){const u=await tpRequireAdmin();if(!u)return;tpAddLogout();await refresh();}
async function refresh(){rows=await tpLoadPlayers();render();}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){const q=tpNorm(document.getElementById('search').value);const arr=rows.filter(p=>tpNorm(p.nome).includes(q));document.getElementById('list').innerHTML='<table class="table"><thead><tr><th>Jogador</th><th>Nível</th><th>Mix 1.º Lugar</th><th>Ações</th></tr></thead><tbody>'+arr.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.nivel)}</td><td class="win">${p.vitorias_mix_1_lugar||0}</td><td class="actions"><button onclick="edit('${p.id}')">✏️ Editar</button><button onclick="del('${p.id}')">🗑️</button></td></tr>`).join('')+'</tbody></table>';}
document.getElementById('search').oninput=render;
document.getElementById('add').onclick=async()=>{const nome=document.getElementById('name').value.trim(),nivel=document.getElementById('level').value,msg=document.getElementById('msg');if(!nome)return;try{const c=await tpWait();if(editId){const {error}=await c.from('jogadores').update({nome,nivel,updated_at:new Date().toISOString()}).eq('id',editId);if(error)throw error;editId=null;document.getElementById('add').textContent='+ ADICIONAR';}else{const {error}=await c.from('jogadores').insert({nome,nivel});if(error)throw error;}document.getElementById('name').value='';msg.textContent='✓ Guardado';await refresh();}catch(e){msg.textContent='Erro: '+e.message}};
window.edit=id=>{const p=rows.find(x=>x.id===id);if(!p)return;editId=id;document.getElementById('name').value=p.nome;document.getElementById('level').value=p.nivel;document.getElementById('add').textContent='✓ GUARDAR ALTERAÇÃO';window.scrollTo({top:0,behavior:'smooth'});};
window.del=async id=>{if(!confirm('Eliminar este jogador da base?'))return;const c=await tpWait();const {error}=await c.from('jogadores').update({ativo:false,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await refresh();};
boot();
</script></body></html>
