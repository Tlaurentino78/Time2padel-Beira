<!doctype html><html lang="pt"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time2Padel — Jogadores das Reservas</title>
<style>
body{margin:0;font-family:Arial;background:#f4f4f4;color:#222}header{background:#303030;color:white;padding:16px;font-size:21px;font-weight:800;text-align:center}.wrap{max-width:1000px;margin:auto;padding:14px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}button,a{padding:10px 13px;border-radius:8px;border:1px solid #ccc;font-weight:800;text-decoration:none;display:inline-block}button{cursor:pointer}.green{background:#20b963;color:white;border-color:#20b963}.red{background:white;color:#b00020;border-color:#e2b4bb}.gray{background:white;color:#222}.top{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.msg{padding:12px;border-radius:8px;background:#f0f2f4;margin:10px 0;font-size:14px}.error{background:#ffe9ec;color:#9b1023}.ok{background:#e9faef;color:#176b35}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#f0f2f4}.badge{padding:5px 8px;border-radius:7px;font-size:12px;font-weight:800}.pending{background:#fff1cf;color:#8a5a00}.approved{background:#e5f8ea;color:#176b35}.rejected{background:#ffe6e9;color:#a20e25}.actions{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body>
<header>🎾 Time2Padel — Jogadores das Reservas</header><div class="wrap">
<div class="card top"><div><a class="gray" href="admin.html">← Administração</a> <a class="gray" href="index.html">🏠 Início</a></div><div>👑 Administrador <button class="gray" onclick="logout()">Sair</button></div></div>
<div id="msg" class="msg">A carregar jogadores...</div>
<div class="card"><h2>Inscrições</h2><p style="color:#666">Lista exclusiva das reservas, separada dos jogadores das competições.</p>
<div class="tableWrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Email</th><th>Estado</th><th>Acesso</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const SB='https://gvsotgzntwfpikigoxdj.supabase.co',KEY='sb_publishable_zeRBh7-ziG_jgF-CTeRQRQ_NFVmFGWc',token=localStorage.getItem('tp_access_token');
const H=(json=false)=>{const h={apikey:KEY};if(json)h['Content-Type']='application/json';if(token)h.Authorization='Bearer '+token;return h};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function logout(){localStorage.removeItem('tp_access_token');localStorage.removeItem('tp_refresh_token');location.href='index.html'}
async function load(){
 const r=await fetch(SB+'/rest/v1/rpc/admin_listar_jogadores_reservas',{method:'POST',headers:{...H(true),Prefer:'return=representation'},body:'{}'});
 if(!r.ok)throw new Error(await r.text()||'Erro ao carregar a lista');
 const data=await r.json(),tb=document.getElementById('rows');tb.innerHTML='';
 if(!data.length){tb.innerHTML='<tr><td colspan="6">Ainda não existem inscrições.</td></tr>';return}
 data.forEach(p=>{const cls=p.estado==='Aprovado'?'approved':p.estado==='Rejeitado'?'rejected':'pending',acesso=p.role==='admin'?'👑 Administrador':'🎾 Jogador',adm=p.auth_user_id?(p.role==='admin'?`<button class="red" onclick="role('${p.id}',false)">Tirar Admin</button>`:`<button class="green" onclick="role('${p.id}',true)">👑 Tornar Admin</button>`):'';tb.insertAdjacentHTML('beforeend',`<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.telefone||'—')}</td><td>${esc(p.email||'—')}</td><td><span class="badge ${cls}">${esc(p.estado||'Pendente')}</span></td><td>${acesso}</td><td class="actions"><button class="green" onclick="estado('${p.id}','Aprovado')">Aprovar</button><button class="red" onclick="estado('${p.id}','Rejeitado')">Rejeitar</button>${adm}</td></tr>`)});
 const m=document.getElementById('msg');m.className='msg ok';m.textContent=data.length+' jogador(es) encontrado(s).';
}
async function estado(id,s){const r=await fetch(SB+'/rest/v1/rpc/admin_estado_jogador_reserva',{method:'POST',headers:{...H(true),Prefer:'return=minimal'},body:JSON.stringify({p_id:id,p_estado:s})});if(!r.ok){alert(await r.text());return}load()}
async function role(id,a){if(!confirm(a?'Tornar este jogador Administrador?':'Retirar acesso de Administrador?'))return;const r=await fetch(SB+'/rest/v1/rpc/admin_definir_staff',{method:'POST',headers:{...H(true),Prefer:'return=minimal'},body:JSON.stringify({p_jogador_reserva_id:id,p_admin:a})});if(!r.ok){alert(await r.text());return}load()}
(async()=>{if(!token){location.href='reservas.html';return}try{const u=await fetch(SB+'/auth/v1/user',{headers:H()});if(!u.ok)throw Error('Sessão expirada');await load()}catch(e){const m=document.getElementById('msg');m.className='msg error';m.textContent='⛔ '+e.message}})();
</script></body></html>
