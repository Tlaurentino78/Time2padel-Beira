<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time2Padel — Administração</title><style>:root{--g:#20cf68;--d:#303030;--bg:#f4f4f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#222}.box{max-width:420px;margin:10vh auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 20px #0001}h1{margin-top:0}input,button{width:100%;height:46px;border-radius:8px;border:1px solid #aaa;padding:10px;font-size:16px;margin-top:10px}button{font-weight:800}.green{background:var(--g);border-color:var(--g);color:#fff}.msg{margin-top:12px;font-weight:700}.muted{color:#777;font-size:13px}</style><script src="cloud.js"></script></head><body><div class="box"><h1>🏆 Time2Padel</h1><p>Área de administração</p><input id="email" type="email" value="tiago@visioluz.com" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="green" id="login">ENTRAR</button><div id="msg" class="msg"></div><p class="muted">Acesso reservado à administração.</p></div><script>document.getElementById('login').onclick=async()=>{const msg=document.getElementById('msg');msg.textContent='A entrar...';try{const c=await tpWait();const {error}=await c.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});if(error)throw error;location.href='index.html';}catch(e){msg.style.color='#b00020';msg.textContent='Não foi possível entrar: '+e.message}};</script></body></html>
