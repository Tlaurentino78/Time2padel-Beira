<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time2Padel — Resultados Públicos</title><style>:root{--g:#20cf68;--d:#303030;--bg:#f4f4f4;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#222}header{background:var(--d);color:#fff;padding:16px;font-size:22px;font-weight:800}.topnav{display:flex;gap:7px;flex-wrap:wrap;padding:10px;max-width:1200px;margin:auto}.topnav a{background:#fff;border:1px solid #ddd;border-radius:8px;padding:9px 11px;text-decoration:none;color:#222;font-weight:800;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:10px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:16px}.hero{background:#303030;color:#fff}.pub{border:2px solid var(--g)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}th:not(:first-child),td:not(:first-child){text-align:center}.champ{background:#fff8d8;font-weight:800}.muted{color:#777;font-size:13px}.empty{text-align:center;padding:35px;color:#777}@media(max-width:650px){table{font-size:13px}}</style><script src="cloud.js"></script></head><body><header>Time2Padel 🏆 — Resultados</header><nav class="topnav"><a href="publico.html">📣 Resultados</a><a href="login.html">🔐 Administração</a></nav><main class="wrap"><div class="hero"><h1>📣 Resultados Time2Padel</h1><p>Consulta pública dos Mixes publicados pelo clube.</p></div><div id="content" class="empty">A carregar...</div></main><script>async function load(){try{const c=await tpWait();const {data,error}=await c.from('publicacoes').select('id,titulo,publicada_em,dados').eq('publicada',true).order('publicada_em',{ascending:false}).limit(20);if(error)throw error;const arr=data||[];if(!arr.length){document.getElementById('content').innerHTML='<div class="empty">Ainda não existem resultados publicados.</div>';return;}document.getElementById('content').innerHTML=arr.map(p=>{const d=p.dados||{},rank=d.ranking||[];return `<section class="card pub"><h2>${esc(p.titulo||d.nome||'Time2Padel')}</h2><div class="muted">Publicado em: ${new Date(p.publicada_em).toLocaleString('pt-PT')}</div><p><b>Formato:</b> ${esc(d.formato||'')} ${d.nivel?` · <b>Nível:</b> ${esc(d.nivel)}`:''}</p><table><thead><tr><th>Pos.</th><th>Equipa</th><th>Vitórias</th><th>Diferença</th></tr></thead><tbody>${rank.map((x,i)=>`<tr class="${i===0?'champ':''}"><td>${x.position||i+1}º ${i===0?'🏆':''}</td><td>${esc(x.team)}</td><td>${x.wins??''}</td><td>${x.diff??''}</td></tr>`).join('')}</tbody></table></section>`}).join('');}catch(e){document.getElementById('content').innerHTML='<div class="empty">Erro ao carregar resultados: '+esc(e.message)+'</div>';}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}load();</script></body></html>
