<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time2Padel — Resultados</title>
<style>
:root{--g:#20cf68;--dark:#303030;--bg:#f4f4f4;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#222}
header{background:var(--dark);color:#fff;padding:18px 16px;font-size:26px;font-weight:900}.nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1100px;margin:auto;padding:10px}.nav a{background:#fff;border:1px solid #ddd;border-radius:9px;padding:10px 13px;text-decoration:none;color:#222;font-weight:800}
.wrap{max-width:1100px;margin:auto;padding:10px}.hero{background:var(--dark);color:#fff;border-radius:14px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 8px;font-size:42px}.hero p{margin:0;color:#ddd;font-size:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}.title{padding:16px 18px;background:var(--g);color:#fff;font-size:23px;font-weight:900}.body{padding:14px}.meta{color:#777;margin-bottom:14px;font-size:14px}.empty,.loading{text-align:center;padding:28px;color:#777;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:center;font-size:14px}th:first-child,td:first-child{text-align:left;width:55px}.team{text-align:left;font-weight:800}.champ{background:#fff6c9}.second{background:#f2f4f6}.third{background:#fff0e2}.tag{display:inline-block;padding:4px 8px;border-radius:12px;background:#eee;font-size:12px;font-weight:800}
@media(max-width:700px){header{font-size:22px}.hero h1{font-size:32px}th,td{font-size:12px;padding:8px 5px}}
</style></head><body>
<header>Time2Padel 🏆 — Resultados</header>
<nav class="nav"><a href="index.html">🏠 Página Inicial</a><a href="admin.html">🔐 Administração</a></nav>
<main class="wrap"><section class="hero"><h1>📣 Resultados Time2Padel</h1><p>Consulta pública dos Mixes publicados pelo clube.</p></section><div id="app" class="loading">A carregar resultados...</div></main>
<script>
const SB='https://gvsotgzntwfpikigoxdj.supabase.co',KEY='sb_publishable_zeRBh7-ziG_jgF-CTeRQRQ_NFVmFGWc';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path){const r=await fetch(SB+path,{headers:{apikey:KEY}});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch(e){d=t}if(!r.ok)throw Error(d?.message||String(d)||('HTTP '+r.status));return d}
function finished(m){return m&&m.estado==='finalizado'&&m.score_a!=null&&m.score_b!=null}
function winner(m){if(!finished(m)||Number(m.score_a)===Number(m.score_b))return null;return Number(m.score_a)>Number(m.score_b)?m.equipa_a_id:m.equipa_b_id}
function positions(teams,js,fmt){
 const pos={};
 const set=(fase,a,b)=>{const m=js.find(x=>x.fase===fase);const w=winner(m);if(!w)return;pos[a]=w;pos[b]=w===m.equipa_a_id?m.equipa_b_id:m.equipa_a_id};
 if(fmt.includes('mega')){set('FINAL',1,2);set('3º/4º',3,4);set('5º/6º',5,6);set('7º/8º',7,8)}
 else {set('FINAL',1,2);set('3º/4º',3,4)}
 return pos
}
function mix6Standings(teams,js){const s=teams.map((t,i)=>({id:t.id,i,w:0,gf:0,ga:0,d:0}));for(const m of js){if(!finished(m))continue;const a=s.find(x=>x.id===m.equipa_a_id),b=s.find(x=>x.id===m.equipa_b_id);if(!a||!b)continue;const x=Number(m.score_a),y=Number(m.score_b);a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;a.d+=x-y;b.d+=y-x;if(x>y)a.w++;else if(y>x)b.w++}return s.sort((a,b)=>b.w-a.w||b.d-a.d||b.gf-a.gf||a.i-b.i).map(x=>x.id)}
function teamName(teams,id){return teams.find(t=>t.id===id)?.nome||'Equipa'}
async function load(){
 try{
  const ts=await api('/rest/v1/torneios?select=id,nome,formato,nivel,data_torneio,publicado&publicado=eq.true&order=data_torneio.desc');
  if(!ts.length){$('app').innerHTML='<div class="card"><div class="empty">Ainda não existem resultados publicados.</div></div>';return}
  let out='';
  for(const t of ts){
   const teams=await api('/rest/v1/equipas?select=id,nome,posicao_inicial&torneio_id=eq.'+encodeURIComponent(t.id));
   const js=await api('/rest/v1/jogos?select=id,equipa_a_id,equipa_b_id,fase,estado,score_a,score_b,ordem&torneio_id=eq.'+encodeURIComponent(t.id));
   const fmt=String(t.formato||'').toLowerCase();let ids=[];
   if(fmt.includes('mix 6')||fmt==='mix6'||teams.length===6) ids=mix6Standings(teams,js);
   else {const p=positions(teams,js,fmt);ids=Object.keys(p).sort((a,b)=>Number(a)-Number(b)).map(k=>p[k]);}
   if(!ids.length)continue;
   const title=t.nome||'Mix Time2Padel';const date=t.data_torneio?new Date(t.data_torneio+'T00:00:00').toLocaleDateString('pt-PT'):'';
   out+=`<section class="card"><div class="title">${esc(title)}</div><div class="body"><div class="meta">Publicado em ${date}${t.nivel?' · Nível: '+esc(t.nivel):''}<br><span class="tag">Formato: ${esc(t.formato||'')}</span></div><table><thead><tr><th>Pos.</th><th>Equipa / Jogadores</th><th>Vitórias</th><th>Diferença</th></tr></thead><tbody>`;
   ids.forEach((id,i)=>{let w='—',d='—';const rel=js.filter(m=>m.equipa_a_id===id||m.equipa_b_id===id);let wins=0,diff=0;for(const m of rel)if(finished(m)){const a=Number(m.score_a),b=Number(m.score_b);if(m.equipa_a_id===id){diff+=a-b;if(a>b)wins++}else{diff+=b-a;if(b>a)wins++}}w=wins;d=diff;out+=`<tr class="${i===0?'champ':i===1?'second':i===2?'third':''}"><td><b>${i+1}º</b>${i===0?' 🏆':''}</td><td class="team">${esc(teamName(teams,id))}</td><td>${w}</td><td>${d}</td></tr>`});
   out+='</tbody></table></div></section>';
  }
  $('app').innerHTML=out||'<div class="card"><div class="empty">Ainda não existem resultados concluídos para apresentar.</div></div>';
 }catch(e){$('app').innerHTML='<div class="card"><div class="empty" style="color:#b00020">Erro ao carregar resultados: '+esc(e.message)+'</div></div>'}
}
load();
</script></body></html>
