<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time2Padel — Ranking</title>
<style>
:root{--g:#20cf68;--dark:#303030;--bg:#f4f4f4;--line:#ddd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#222}
header{background:var(--dark);color:#fff;padding:16px;font-size:23px;font-weight:800}
.wrap{max-width:900px;margin:auto;padding:12px}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.nav a{background:#fff;border:1px solid #ddd;border-radius:8px;padding:9px 12px;text-decoration:none;color:#222;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.head{background:var(--g);color:#fff;padding:13px 15px;font-size:20px;font-weight:800}
.body{padding:14px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #eee;text-align:center}
th:first-child,td:first-child{text-align:left}tr:first-child{font-weight:800}
.muted{color:#777}.champ{font-size:12px;color:#159a52;font-weight:800}
@media(max-width:600px){th,td{font-size:13px;padding:9px 5px}}
</style>
</head>
<body>
<header>Time2Padel 🏆 — Ranking</header>
<div class="wrap">
<nav class="nav">
<a href="index.html">🏠 Início</a>
<a href="torneios.html">🏆 Torneios</a>
<a href="publico.html">📣 Resultados</a>
</nav>
<div class="card">
<div class="head">🏆 Ranking Time2Padel</div>
<div class="body">
<div id="status" class="muted">A carregar ranking...</div>
<div style="overflow-x:auto;margin-top:10px">
<table id="tbl" style="display:none">
<thead><tr><th>Pos.</th><th>Jogador</th><th>Nível</th><th>Pontos</th><th>1.º Lugar</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div></div>
</div>
<script>
const SUPABASE_URL='https://gvsotgzntwfpikigoxdj.supabase.co';
const SUPABASE_KEY='sb_publishable_zeRBh7-ziG_jgF-CTeRQRQ_NFVmFGWc';
async function api(path){
 const r=await fetch(SUPABASE_URL+path,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
 if(!r.ok) throw new Error(await r.text());
 return r.json();
}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function points(pos){return [10,8,6,5,4,3,2,1][pos-1]||0;}
async function load(){
 try{
   const players=await api('/rest/v1/jogadores?select=*');
   const rows=players.filter(p=>p.nivel && p.nivel!=='Sem nível')
     .map(p=>({nome:p.nome,nivel:p.nivel,pontos:Number(p.pontos_mix||p.pontos||0),primeiros:Number(p.vitorias_mix_1_lugar||p.primeiros_lugares||0)}))
     .sort((a,b)=>b.pontos-a.pontos||b.primeiros-a.primeiros||a.nome.localeCompare(b.nome));
   const body=document.getElementById('rows');
   if(!rows.length){document.getElementById('status').textContent='Ainda não existem dados de ranking publicados.';return;}
   body.innerHTML=rows.map((p,i)=>`<tr><td>${i+1}º</td><td style="text-align:left">${esc(p.nome)}</td><td>${esc(p.nivel)}</td><td>${p.pontos}</td><td>${p.primeiros}</td></tr>`).join('');
   document.getElementById('status').textContent='Ranking público';
   document.getElementById('tbl').style.display='table';
 }catch(e){document.getElementById('status').textContent='Não foi possível carregar o ranking neste momento.';}
}
load();
</script>
</body>
</html>
